[pytest]
testpaths = .
# Put the repo root (parent of this rootdir) on sys.path so the in-repo,
# wheel-excluded ``torch_additions`` package is importable in tests.
pythonpath = ..
python_files = test_*.py
python_classes = Test* Prop* Bench*
python_functions = test_*

# Custom markers (prevents PytestUnknownMarkWarning)
markers =
    requires_ref: test needs reference_data/*.mat (run export_reference_data.m first)
    requires_impl: test needs the cool-frames Python package to be installed
    requires_torch: test needs torch installed
    requires_torch_impl: test needs the cool_frames.torch backend
    requires_cuda: test needs a CUDA device
    slow: test is computationally heavy (skip with -m "not slow")
    unit: structural unit test (shape, dtype, sign)
    property: invariant property test (parametrized or hypothesis-based)

# Filter noisy warnings from third-party libraries
filterwarnings =
    ignore::UserWarning:hypothesis
    ignore::DeprecationWarning

# Hypothesis profile used when running the full suite
# Override per-test with @settings(max_examples=...)
addopts = --tb=short -q

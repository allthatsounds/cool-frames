# Configuration for automatically generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog

  categories:
    - title: "Breaking Changes"
      labels:
        - breaking

    - title: "New Features"
      labels:
        - enhancement
        - feature

    - title: "Bug Fixes"
      labels:
        - bug
        - fix

    - title: "Documentation"
      labels:
        - documentation
        - docs

    - title: "Performance"
      labels:
        - performance
        - benchmark

    - title: "Dependencies"
      labels:
        - dependencies

    - title: "CI & Infrastructure"
      labels:
        - ci
        - infrastructure

    - title: "Other Changes"
      labels:
        - "*"

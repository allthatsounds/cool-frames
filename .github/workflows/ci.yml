name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Lint & type-check (fast, runs once on latest Python)
  # P3: Failures now block merge (continue-on-error removed)
  # -----------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        # Pinned: an unpinned linter turns main red when a new release
        # promotes a preview rule to stable, with no code change.
        run: pip install "ruff==0.16.4" "mypy==1.20.2"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # Mypy over the torch backend + core numpy math (plugingen removed in the
      # 2026-06 consolidation).
      # Focused on the torch backend + core numpy math. follow-imports=silent
      # keeps the check on these roots without failing on transitively-followed
      # research layers (auditory/cognition) that carry their own typing debt.
      - name: Mypy (package)
        run: mypy cool_frames/torch cool_frames/numpy/core/_math.py cool_frames/numpy/core/_fourier.py cool_frames/numpy/core/_norm.py --ignore-missing-imports --follow-imports=silent

  # -----------------------------------------------------------------------
  # NumPy backend tests (matrix: Python 3.10–3.13)
  # -----------------------------------------------------------------------
  test-numpy:
    name: "NumPy tests · Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run NumPy backend tests
        run: |
          pytest tests/ \
            --ignore=tests/torch_backend \
            --ignore=tests/legacy \
            -m "not slow and not requires_ref" \
            --tb=short -q \
            --cov=cool_frames \
            --cov-report=xml:coverage-numpy-${{ matrix.python-version }}.xml \
            --junitxml=results-numpy-${{ matrix.python-version }}.xml

      # Doctests are part of the public documentation and were not covered by
      # any job: `testpaths` limits pytest to tests/ and benchmarks/, so 33 of
      # them had rotted, four with substantive factual errors (`cqtfilters`
      # documented as returning 14 channels against an actual 66) and ten that
      # could never have run at all (`audfilters(16000)` with the length
      # argument missing, examples referring to undefined names). A doc example
      # that is not executed is not documentation, it is a claim.
      #
      # `cool_frames/torch` is excluded HERE and covered in the test-torch job
      # instead: this job installs `.[dev]` without torch, and
      # `--doctest-modules` imports every module it walks, so all 30 torch
      # modules fail to collect rather than being skipped.
      - name: Run doctests
        run: |
          pytest --doctest-modules cool_frames/ \
            --ignore=cool_frames/torch \
            --tb=short -q

      # Codecov's token has to exist before `fail_ci_if_error: true` is safe.
      # Without this step a missing secret surfaces as an upload error from
      # inside the action — a red build whose log does not say what to do about
      # it.  Checking first turns that into one line naming the fix.
      #
      # Skipped for pull requests from forks, which cannot see repository
      # secrets at all; the upload below is skipped for the same reason, so an
      # outside contributor gets a green build without coverage rather than a
      # failure they cannot act on.
      - name: Check the Codecov token is configured
        if: matrix.python-version == '3.12' && github.event.pull_request.head.repo.fork != true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error title=CODECOV_TOKEN is not set::Coverage cannot be uploaded."
            echo ""
            echo "The repository secret CODECOV_TOKEN is missing or empty."
            echo ""
            echo "  1. Get the token from https://codecov.io -> cool-frames -> Settings"
            echo "  2. gh secret set CODECOV_TOKEN --repo allthatsounds/cool-frames"
            echo ""
            echo "Coverage comes from two jobs that each see half the library"
            echo "(the numpy job cannot import torch). Only the union is the"
            echo "real number, so both uploads have to land -- see codecov.yml."
            echo ""
            echo "To stop gating CI on coverage instead, remove this step and"
            echo "the 'fail_ci_if_error: true' lines from both upload steps."
            exit 1
          fi
          echo "CODECOV_TOKEN is set."

      - name: Upload coverage
        if: matrix.python-version == '3.12' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@v5
        with:
          files: coverage-numpy-${{ matrix.python-version }}.xml
          flags: numpy
          token: ${{ secrets.CODECOV_TOKEN }}
          # A dropped upload used to be a warning in a green job. The project
          # read 76 % — the numpy job alone — because the torch report was not
          # landing and nothing said so. See codecov.yml.
          fail_ci_if_error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-numpy-${{ matrix.python-version }}
          path: results-numpy-*.xml

  # -----------------------------------------------------------------------
  # Cross-language (MATLAB <-> Python) regression gate.
  # Regenerates the Python reference with the current cool-frames and diffs it
  # against the committed MATLAB reference .mat files, so the three reconciled
  # divergences (low-pass hop, firwin centring, Nyquist) cannot silently
  # reappear. No MATLAB needed in CI (--skip-matlab).
  #
  # -----------------------------------------------------------------------
  crosslang:
    name: "Cross-language (MATLAB <-> Python) diff"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + scipy
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" scipy

      - name: Cross-language diff (Python vs committed MATLAB reference)
        run: |
          python tests/crosslang/run_crosslang_tests.py --skip-matlab --tol 1e-8

      - name: Upload cross-language report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosslang-report
          path: tests/crosslang/results/crosslang_report.*

  # -----------------------------------------------------------------------
  # Torch backend tests (latest Python, CPU only)
  # -----------------------------------------------------------------------
  test-torch:
    name: "Torch backend tests · Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + torch + dev deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,torch]"
          # Use CPU-only torch to keep CI fast
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # `tests/torch_backend/` is not where all the torch tests live: the
      # regression suites carry torch cases too, guarded with
      # `pytest.importorskip("torch")`. Those skip in test-numpy (no torch
      # installed) and were never *collected* here, so every regression
      # protecting a torch fix ran nowhere in CI — green locally, absent
      # upstream. Their coverage never reached codecov either.
      - name: Run Torch backend tests
        run: |
          pytest tests/torch_backend/ tests/regressions/ \
            -m "not slow" \
            --tb=short -q \
            --cov=cool_frames \
            --cov-report=xml:coverage-torch-${{ matrix.python-version }}.xml \
            --junitxml=results-torch-${{ matrix.python-version }}.xml

      # The other half of the doctest split: test-numpy runs everything except
      # cool_frames/torch, which only imports where torch is installed.
      - name: Run torch doctests
        run: pytest --doctest-modules cool_frames/torch --tb=short -q

      # Codecov's token has to exist before `fail_ci_if_error: true` is safe.
      # Without this step a missing secret surfaces as an upload error from
      # inside the action — a red build whose log does not say what to do about
      # it.  Checking first turns that into one line naming the fix.
      #
      # Skipped for pull requests from forks, which cannot see repository
      # secrets at all; the upload below is skipped for the same reason, so an
      # outside contributor gets a green build without coverage rather than a
      # failure they cannot act on.
      - name: Check the Codecov token is configured
        if: matrix.python-version == '3.12' && github.event.pull_request.head.repo.fork != true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error title=CODECOV_TOKEN is not set::Coverage cannot be uploaded."
            echo ""
            echo "The repository secret CODECOV_TOKEN is missing or empty."
            echo ""
            echo "  1. Get the token from https://codecov.io -> cool-frames -> Settings"
            echo "  2. gh secret set CODECOV_TOKEN --repo allthatsounds/cool-frames"
            echo ""
            echo "Coverage comes from two jobs that each see half the library"
            echo "(the numpy job cannot import torch). Only the union is the"
            echo "real number, so both uploads have to land -- see codecov.yml."
            echo ""
            echo "To stop gating CI on coverage instead, remove this step and"
            echo "the 'fail_ci_if_error: true' lines from both upload steps."
            exit 1
          fi
          echo "CODECOV_TOKEN is set."

      - name: Upload coverage
        if: matrix.python-version == '3.12' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@v5
        with:
          files: coverage-torch-${{ matrix.python-version }}.xml
          flags: torch
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-torch-${{ matrix.python-version }}
          path: results-torch-*.xml

  # -----------------------------------------------------------------------
  # Documentation build
  # -----------------------------------------------------------------------
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs tags for the version in the docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package + docs deps
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx HTML
        run: sphinx-build -b html docs/ docs/_build/html

      - name: Upload docs as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # -----------------------------------------------------------------------
  # Publish the built docs to GitHub Pages (pushes to main only).
  # Requires Settings -> Pages -> Source: GitHub Actions.
  # -----------------------------------------------------------------------
  deploy-docs:
    name: Deploy docs
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -----------------------------------------------------------------------
  # Package build check
  # -----------------------------------------------------------------------
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs full history for versioning

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

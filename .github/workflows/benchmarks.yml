name: Benchmarks

on:
  # Run nightly on main to keep the baseline fresh
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  # Allow manual runs (e.g. to save a new baseline after a big change)
  workflow_dispatch:
    inputs:
      save_baseline:
        description: "Save result as new baseline (yes/no)"
        required: false
        default: "no"
  # Comment benchmark results on PRs that touch core code
  pull_request:
    paths:
      - "cool_frames/**"
      - "benchmarks/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + benchmark deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/.benchmarks
          key: bench-baseline-${{ runner.os }}-${{ hashFiles('cool_frames/**/*.py') }}
          restore-keys: bench-baseline-${{ runner.os }}-

      - name: Run NumPy benchmarks
        run: |
          pytest benchmarks/bench_filterbank.py benchmarks/bench_phase.py \
            --benchmark-only \
            --benchmark-json=bench_results.json \
            --benchmark-autosave \
            -q

      - name: Check for regressions (vs. cached baseline)
        if: github.event_name == 'pull_request'
        run: |
          pytest benchmarks/bench_filterbank.py benchmarks/bench_phase.py \
            --benchmark-only \
            --benchmark-compare \
            --benchmark-compare-fail=mean:15% \
            -q || echo "::warning::Performance regression detected — see benchmark output above"

      - name: Save baseline (manual trigger)
        if: github.event.inputs.save_baseline == 'yes'
        uses: actions/cache@v4
        with:
          path: benchmarks/.benchmarks
          key: bench-baseline-${{ runner.os }}-${{ hashFiles('cool_frames/**/*.py') }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_results.json

  bench-torch:
    name: Run torch benchmarks (CPU)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + torch + benchmark deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,torch]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run torch benchmarks
        run: |
          pytest benchmarks/bench_torch.py \
            --benchmark-only \
            --benchmark-json=bench_torch_results.json \
            -q

      - name: Upload torch benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-torch-results
          path: bench_torch_results.json

  bench-torch-gpu:
    name: Run torch benchmarks (GPU)
    # GitHub-hosted runners have no GPU; this targets a self-hosted runner
    # with a CUDA device (e.g. the lab's H100 box) labelled `gpu`.
    # Runs on the nightly schedule / manual dispatch only — the GPU runner
    # may be offline, so the job is allowed to be skipped, not block PRs.
    runs-on: [self-hosted, gpu]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + CUDA torch + benchmark deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,torch]"
          # CUDA build; adjust the index URL to match the runner's driver.
          pip install torch --index-url https://download.pytorch.org/whl/cu124

      - name: Report GPU
        run: |
          python -c "import torch; print('cuda available:', torch.cuda.is_available()); \
            print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no GPU')"

      - name: Run torch benchmarks (CPU + CUDA cases)
        run: |
          pytest benchmarks/bench_torch.py \
            --benchmark-only \
            --benchmark-json=bench_torch_gpu_results.json \
            -q

      - name: Upload torch GPU benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-torch-gpu-results
          path: bench_torch_gpu_results.json
